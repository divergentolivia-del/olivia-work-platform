# Render 部署配置 — Olivia Work Platform
# 使用方法：
#   1. 将本项目推送到 GitHub
#   2. 在 https://dashboard.render.com 点击 "New +" → "Blueprint"
#   3. 选择你的 GitHub 仓库，Render 会自动识别此配置文件
#   4. （可选）在 Render 后台 Environment 中添加 API Key 环境变量
#   5. 部署完成后获得公网 URL，手机浏览器访问即可

services:
  - type: web
    name: olivia-work-platform
    runtime: node
    plan: free                    # 免费套餐，个人使用足够
    region: singapore             # 新加坡节点，国内访问较快（也可选 oregon）
    buildCommand: ""              # 无需构建，纯 Node.js 内置模块
    startCommand: node server.js
    healthCheckPath: /            # 健康检查
    autoDeploy: true              # 推送代码自动部署
    envVars:
      # 以下为可选环境变量，在 Render 后台填写或在此配置
      # 平台级 API Key（优先级最高，用户零配置使用）
      - key: PLATFORM_DEEPSEEK_API_KEY
        sync: false
      - key: PLATFORM_ARK_API_KEY
        sync: false
      - key: PLATFORM_DASHSCOPE_API_KEY
        sync: false
      - key: PLATFORM_MOONSHOT_API_KEY
        sync: false
      - key: PLATFORM_ANTHROPIC_API_KEY
        sync: false
      - key: PLATFORM_OPENAI_API_KEY
        sync: false
      # 端口（Render 自动注入，无需手动设置）
      - key: PORT
        value: 10000
